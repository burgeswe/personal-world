# Personal World — supported standalone deployment.
# One appliance: core/API + dashboard served by one process, plus a
# persistent volume. No homelab, Gitea, Komodo, or any provider is
# required to boot; optional providers are wired via config/connections.json.

services:
  core:
    build: .
    image: personal-world:0.1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Auth boundary: fail-closed. Compose parses with no .env present
      # (config-time interpolation defaults to empty); runtime still
      # refuses to boot without a token -- see Dockerfile CMD guard and
      # the healthcheck's auth_configured assertion. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      PW_API_TOKEN: ${PW_API_TOKEN:-}
      # Chat provider keys use env indirection; forwarded to the core here.
      XIAOMI_MIMO_API_KEY: ${XIAOMI_MIMO_API_KEY:-}
    volumes:
      - world-data:/data
      - ./config:/config:ro
    healthcheck:
      # Unhealthy (restarts) when auth is not configured: an empty
      # PW_API_TOKEN must never settle into a green container.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys,json; \
              r=urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4); \
              d=json.load(r); \
              sys.exit(0 if r.status==200 and d.get('auth_configured') is True else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  world-data: