<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Personal World — Saturn pet source rig</title>
<desc id="desc">A friendly round buttercream planet with pastel peach cloud bands, rosy cheeks and a tilted lavender ring with a mint stripe. Separate back and front ring layers create clear Saturn depth. Transparent background.</desc>
