name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Pytest
        run: uv run pytest --timeout=30

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compose config validates
        run: |
          echo "PW_API_TOKEN=ci-placeholder-token" > .env
          docker compose config -q
      - name: Image builds (frontend stage tolerates absent frontend/)
        run: docker build -t personal-world:ci .

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Leakage + cemented-policy + read-safety gates
        run: uv run pytest --timeout=30 tests/test_core.py -k "SettingsExportSafety or CementedPolicy or TestJournal or WorldExport" -v

  framework-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Framework conformance (native baseline + optional enrichment)
        run: uv run pytest --timeout=30 tests/test_framework.py -v
      - name: Repo config passes its own framework validator
        run: uv run personal-world framework validate --json
