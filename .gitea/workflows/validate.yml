name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Pytest
        run: uv run pytest --timeout=30

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compose config validates
        run: |
          echo "PW_API_TOKEN=ci-placeholder-token" > .env
          docker compose config -q
      - name: Image builds (frontend stage tolerates absent frontend/)
        run: docker build -t personal-world:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Clean install, token drift, lint, tests, build (node 22)
        # Same base image the Dockerfile frontend stage uses. The whole
        # repo is mounted because frontend tests cross the tree boundary
        # (icons.spec.ts asserts shim ids against the backend sprite at
        # src/personal_world/static/icons/sprite.svg, and tokens:check
        # reads design/tokens.json at the acceptance-gate position).
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/frontend node:22-alpine \
            sh -c "npm ci --no-audit --no-fund && npm run tokens:check && npm run lint && npm run test && npm run build"
      - name: No generated artifacts tracked
        run: test -z "$(git status --porcelain -- frontend/dist frontend/node_modules)"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (the e2e server boots the real app via uvicorn)
        run: pip install uv==0.11.28
      - name: Sync python deps (personal_world importable for uvicorn)
        run: uv sync --frozen --extra test
      - name: Install frontend deps, build dist, install Chromium
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Playwright e2e + axe + external-request + zoom proxies (real server)
        run: cd frontend && npx playwright test
      - name: Dist safety (secret scan + VITE grep + bundle budget)
        run: uv run pytest --timeout=60 tests/test_dist_safety.py -v

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Leakage + cemented-policy + read-safety gates
        run: uv run pytest --timeout=30 tests/test_core.py -k "SettingsExportSafety or CementedPolicy or TestJournal or WorldExport" -v

  framework-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Framework conformance (native baseline + optional enrichment)
        run: uv run pytest --timeout=30 tests/test_framework.py -v
      - name: Repo config passes its own framework validator
        run: uv run personal-world framework validate --json
