name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Pytest
        run: uv run pytest --timeout=30

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compose config validates
        run: |
          echo "PW_API_TOKEN=ci-placeholder-token" > .env
          docker compose config -q
      - name: Image builds (frontend stage tolerates absent frontend/)
        run: docker build -t personal-world:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Clean install, lint, tests, build (node 22)
        # Same base image the Dockerfile frontend stage uses; run in-place
        # so the workspace stays on the runner filesystem.
        run: |
          docker run --rm -v "$PWD/frontend:/fe" -w /fe node:22-alpine \
            sh -c "npm ci --no-audit --no-fund && npm run lint && npm run test && npm run build"
      - name: No generated artifacts tracked
        run: test -z "$(git status --porcelain -- frontend/dist frontend/node_modules)"

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Leakage + cemented-policy + read-safety gates
        run: uv run pytest --timeout=30 tests/test_core.py -k "SettingsExportSafety or CementedPolicy or TestJournal or WorldExport" -v

  framework-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Framework conformance (native baseline + optional enrichment)
        run: uv run pytest --timeout=30 tests/test_framework.py -v
      - name: Repo config passes its own framework validator
        run: uv run personal-world framework validate --json
